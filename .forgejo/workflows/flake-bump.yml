name: Bump flake.lock

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Plain git instead of actions/checkout: podman >= 5.8.7 refuses to copy
      # an action's files into the job container under /var/run/act/actions
      # ("path escapes from parent", since /var/run is an absolute symlink to
      # /run in the Ubuntu image), so any `uses:` step fails on nauvoo. The
      # token is saved in the repo's git config so the push step below works.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git clone --depth=1 --branch "$GITHUB_REF_NAME" \
            -c http.extraheader="Authorization: basic $auth" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install linux --no-confirm --init none
          echo "/nix/var/nix/profiles/default/bin" >> $GITHUB_PATH

      - run: nix flake update

      # Gate the push on every host still evaluating against the new lock —
      # unattended bumps have broken hosts before (import-tree API change,
      # nvf option rename), and nauvoo's dotfiles-sync pulls whatever lands.
      # Evaluates each host separately: a single `nix eval --apply mapAttrs`
      # prints per-host errors inline but still exits 0.
      - name: Evaluate all hosts
        run: |
          failed=""
          for kind in nixosConfigurations darwinConfigurations; do
            for host in $(nix eval --raw ".#$kind" --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)'); do
              echo "--- $kind.$host"
              if ! nix eval --raw ".#$kind.$host.config.system.build.toplevel.drvPath"; then
                failed="$failed $host"
              fi
              echo
            done
          done
          if [ -n "$failed" ]; then
            echo "Evaluation failed for:$failed — not pushing the flake.lock bump"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config user.name "nauvoo-actions"
          git config user.email "actions@forgejo.jennex.dev"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key
          git config commit.gpgsign true
          if ! git diff --quiet flake.lock; then
            git add flake.lock
            git commit -m "Bump flake.lock"
            git push
          fi
