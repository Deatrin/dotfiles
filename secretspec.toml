[project]
name = "dotfiles"
revision = "1.0"

# Declare secrets your local dev workflow needs here, then run:
#   secretspec run -- <command>
# to inject them as environment variables. Pick a backend once with:
#   secretspec config init
# (1Password is a supported provider — this is dev-only tooling, separate
# from the op-connect-secrets setup used for production services on nauvoo.)
[profiles.default]
EXAMPLE_SECRET = { description = "Placeholder — replace with a real secret, or remove this entry entirely once you add your first real one", required = false }
